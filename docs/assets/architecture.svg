    <g transform="translate(72 174)"><rect width="254" height="256" rx="18" fill="#fff" stroke="#ddd6fe"/><circle cx="48" cy="50" r="24" fill="#eef2ff"/><path d="M38 51h20M48 41v20" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/><text x="28" y="104" fill="#4f46e5" font-size="12" font-weight="750" letter-spacing="1.2">DESIGN SYSTEM</text><text x="28" y="139" fill="#111827" font-size="23" font-weight="700">Create once</text><text x="28" y="174" fill="#64748b" font-size="15">Print areas · layers</text><text x="28" y="199" fill="#64748b" font-size="15">Fonts · colours · clipart</text><text x="28" y="224" fill="#64748b" font-size="15">Products · variations</text></g>
    <g transform="translate(408 174)"><rect width="254" height="256" rx="18" fill="#fff" stroke="#ddd6fe"/><circle cx="48" cy="50" r="24" fill="#ecfdf5"/><rect x="37" y="38" width="22" height="25" rx="3" fill="none" stroke="#059669" stroke-width="2.5"/><path d="M42 46h12M42 52h12" stroke="#059669" stroke-width="2"/><text x="28" y="104" fill="#059669" font-size="12" font-weight="750" letter-spacing="1.2">STOREFRONT</text><text x="28" y="139" fill="#111827" font-size="23" font-weight="700">Personalise live</text><text x="28" y="174" fill="#64748b" font-size="15">Text · images · artwork</text><text x="28" y="199" fill="#64748b" font-size="15">Theme-aware controls</text><text x="28" y="224" fill="#64748b" font-size="15">Preview confirmation</text></g>
    <g transform="translate(744 174)"><rect width="254" height="256" rx="18" fill="#fff" stroke="#ddd6fe"/><circle cx="48" cy="50" r="24" fill="#eff6ff"/><path d="M36 42h24v18H36zM40 38h16M42 64h12" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/><text x="28" y="104" fill="#0284c7" font-size="12" font-weight="750" letter-spacing="1.2">WOOCOMMERCE</text><text x="28" y="139" fill="#111827" font-size="23" font-weight="700">Order with context</text><text x="28" y="174" fill="#64748b" font-size="15">Cart · checkout · HPOS</text><text x="28" y="199" fill="#64748b" font-size="15">Customer inputs retained</text><text x="28" y="224" fill="#64748b" font-size="15">Protected artwork storage</text></g>
    <g transform="translate(1080 174)"><rect width="288" height="256" rx="18" fill="#312e81"/><circle cx="48" cy="50" r="24" fill="#4f46e5"/><path d="M36 48h24v16H36zM40 38h16v10H40M42 55h12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><text x="28" y="104" fill="#c7d2fe" font-size="12" font-weight="750" letter-spacing="1.2">PRODUCTION</text><text x="28" y="139" fill="#fff" font-size="23" font-weight="700">Generate and deliver</text><text x="28" y="174" fill="#c7d2fe" font-size="15">Async queue · retries</text><text x="28" y="199" fill="#c7d2fe" font-size="15">Print-method renderers</text><text x="28" y="224" fill="#c7d2fe" font-size="15">Downloads · webhooks</text></g>
  </g>
  <g transform="translate(72 493)" font-family="Inter,Segoe UI,Arial,sans-serif"><rect width="1296" height="66" rx="14" fill="#fff" stroke="#e0e7ff"/><circle cx="34" cy="33" r="10" fill="#34d399"/><text x="58" y="29" fill="#111827" font-size="14" font-weight="700">Operational controls throughout</text><text x="58" y="49" fill="#64748b" font-size="13">Signed delivery · configurable retention · queue recovery · regeneration · variable data</text></g>
