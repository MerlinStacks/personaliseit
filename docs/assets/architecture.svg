<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">OverCustomise architecture</title>
  <desc id="desc">The customer, commerce, and production stages of OverCustomise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dy="8" stdDeviation="10" flood-color="#312e81" flood-opacity=".1"/></filter>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#818cf8"/></marker>
  </defs>
  <rect width="1440" height="620" rx="24" fill="url(#bg)"/>
  <text x="72" y="78" fill="#111827" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750">From customer idea to production artwork</text>
  <text x="72" y="112" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">A connected WooCommerce workflow, with each stage retaining the design context.</text>
  <g fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#a)"><path d="M326 302H396"/><path d="M662 302h70"/><path d="M998 302h70"/></g>
