<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Page body -->
  <rect x="10" y="10" width="160" height="200" rx="6" ry="6" fill="#f5f5f5" stroke="#d0d0d0" stroke-width="2"/>
  <!-- Folded corner -->
  <polygon points="130,10 170,50 130,50" fill="#e0e0e0" stroke="#d0d0d0" stroke-width="1"/>
  <!-- PDF badge -->
  <rect x="20" y="80" width="80" height="28" rx="4" fill="#e53e3e"/>
  <text x="60" y="100" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">PDF</text>
  <!-- Lines suggesting text -->
  <line x1="20" y1="125" x2="150" y2="125" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="140" x2="140" y2="140" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="155" x2="130" y2="155" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="170" x2="150" y2="170" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
  <!-- Caption -->
  <text x="100" y="230" font-family="Arial,sans-serif" font-size="11" fill="#999" text-anchor="middle">Preview not available</text>
</svg>
