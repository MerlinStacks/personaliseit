name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php scripts/lint-php.php

  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, libxml, mbstring, xml, xmlwriter
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer test
      - run: composer phpcs
      - run: composer phpstan

  frontend:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_PRODUCT_PATH: ${{ vars.E2E_PRODUCT_PATH }}
      E2E_CART_PATH: ${{ vars.E2E_CART_PATH }}
      E2E_PRODUCT_NAME: ${{ vars.E2E_PRODUCT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run test:js
      - run: npm run build
      - run: npm run test:performance
      - run: npx playwright install --with-deps chromium
        if: env.E2E_BASE_URL != ''
      - run: npm run test:e2e

  distribution:
    needs: [php-quality, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip
      - name: Verify bundled runtime dependencies
        run: |
          unzip -t overcustomise.zip
          unzip -l overcustomise.zip | grep -q 'overcustomise/vendor/autoload.php'
          unzip -l overcustomise.zip | grep -q 'overcustomise/vendor/tecnickcom/tcpdf/tcpdf.php'
          ! unzip -l overcustomise.zip | grep -Eq 'overcustomise/vendor/.*/(test|tests|example|examples)/'
      - uses: actions/upload-artifact@v4
        with:
          name: overcustomise-${{ github.sha }}
          path: overcustomise.zip
          if-no-files-found: error
