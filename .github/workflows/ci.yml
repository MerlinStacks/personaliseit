name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php scripts/lint-php.php

  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, libxml, mbstring, xml, xmlwriter
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer test
      - run: composer phpcs
      - run: composer phpstan
      # Exercise the raster fallback too; the main suite also tests no-Imagick paths.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, gd, imagick, libxml, mbstring, xml, xmlwriter
          coverage: none
      - name: Test engraving raster layout
        env:
          OC_TEST_FONT_PATH: ${{ runner.temp }}/engraving-fallback.ttf
        run: |
          php -r 'if (!extension_loaded("imagick")) { exit(1); } $font = gzuncompress(file_get_contents("vendor/tecnickcom/tc-lib-pdf-font/target/fonts/freefont/freesans.z")); if ($font === false || file_put_contents(getenv("OC_TEST_FONT_PATH"), $font) === false) { exit(1); }'
          vendor/bin/phpunit --filter 'textarea_fallback_wraps|raster_fallback_fits|raster_text_keeps'

  frontend:
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_PRODUCT_PATH: ${{ vars.E2E_PRODUCT_PATH }}
      E2E_CART_PATH: ${{ vars.E2E_CART_PATH }}
      E2E_PRODUCT_NAME: ${{ vars.E2E_PRODUCT_NAME }}
    steps:
      - uses: actions/checkout@v4
      # Cross-renderer pixel tests compare Fabric with the production GD renderer.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run test:js
      - run: npm run build
      - run: npm run test:performance
      # Standalone layout tests need Chromium even without a live E2E site.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  distribution:
    needs: [php-quality, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip
      - name: Verify bundled runtime dependencies
        run: |
          unzip -t overcustomise.zip
          unzip -l overcustomise.zip | grep -q 'overcustomise/vendor/autoload.php'
          unzip -l overcustomise.zip | grep -q 'overcustomise/vendor/tecnickcom/tcpdf/tcpdf.php'
          ! unzip -l overcustomise.zip | grep -Eq 'overcustomise/vendor/.*/(test|tests|example|examples)/'
      - uses: actions/upload-artifact@v4
        with:
          name: overcustomise-${{ github.sha }}
          path: overcustomise.zip
          if-no-files-found: error
